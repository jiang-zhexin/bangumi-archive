name: Publish to Hugging Face

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # required so the job can request an OIDC token
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv run main.py

      - name: Install the hf CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Upload checkpoint
        env:
          HF_OIDC_RESOURCE: datasets/jiangzhexin/bangumi-archive
        run: hf upload jiangzhexin/bangumi-archive ./data . --repo-type dataset --commit-message "Publish from ${GITHUB_SHA::7}"
