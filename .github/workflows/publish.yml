name: Publish to Hugging Face

on:
  schedule:
    - cron: "0 0 * * 4"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # required so the job can request an OIDC token
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Upload checkpoint
        env:
          HF_OIDC_RESOURCE: datasets/jiangzhexin/bangumi-archive
        run: uv run main.py
